<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:#475569"/><stop offset="100%" style="stop-color:#0d9488"/></linearGradient>
    <marker id="a" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker>
  </defs>
  <rect width="780" height="470" fill="#f8fafc" rx="12"/>
  <rect x="270" y="10" width="240" height="28" rx="8" fill="url(#hg)"/>
  <text x="390" y="29" text-anchor="middle" fill="white" font-size="12" font-weight="bold">mcp-parts — Parts &amp; Spares Platform</text>

  <!-- agents -->
  <rect x="40" y="48" width="700" height="42" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.5"/>
  <text x="390" y="62" text-anchor="middle" font-size="9" font-weight="bold" fill="#115e59">Automotive &amp; Manufacturing Agents (clients of the parts platform)</text>
  <text x="390" y="79" text-anchor="middle" font-size="7" fill="#0f766e">Parts Inventory Optimizer · Predictive Fleet Maintenance (automotive) · Predictive Maintenance Agent (manufacturing)</text>
  <line x1="390" y1="90" x2="390" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- tools -->
  <rect x="30" y="110" width="720" height="118" rx="10" fill="white" stroke="#0d9488" stroke-width="2"/>
  <rect x="30" y="110" width="720" height="22" rx="10" fill="url(#hg)"/>
  <text x="390" y="125" text-anchor="middle" fill="white" font-size="10" font-weight="bold">27 Tools — parts &amp; spares platform</text>
  <g font-size="7" font-weight="bold" fill="#115e59" text-anchor="middle">
    <text x="100" y="148">Catalog (7)</text>
    <text x="250" y="148">Stock/Moves (8)</text>
    <text x="395" y="148">Reservations (3)</text>
    <text x="535" y="148">BOM/Super (5)</text>
    <text x="678" y="148">Reorder/Fcst (4)</text>
  </g>
  <g font-size="6.2" fill="#0f766e" text-anchor="middle">
    <text x="100" y="163">part · location</text>
    <text x="100" y="173">supplier · list</text>
    <text x="250" y="163">receive · issue*†</text>
    <text x="250" y="173">transfer · adjust*†</text>
    <text x="395" y="163">reserve · cancel</text>
    <text x="395" y="173">list</text>
    <text x="535" y="163">bom · explode</text>
    <text x="535" y="173">where_used · supersede</text>
    <text x="678" y="163">reorder · usage</text>
    <text x="678" y="173">forecast_demand</text>
  </g>
  <text x="390" y="200" text-anchor="middle" font-size="6.4" fill="#64748b">* requires approval   † external write — consumes/overrides physical stock</text>
  <text x="390" y="214" text-anchor="middle" font-size="6.4" fill="#0d9488" font-weight="bold">oversell + negative-stock guards on every movement</text>
  <line x1="390" y1="228" x2="390" y2="244" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- engines -->
  <rect x="30" y="248" width="720" height="86" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="263" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400e">Domain engines</text>
  <g font-size="6.8" fill="#78350f" text-anchor="middle">
    <text x="125" y="284" font-weight="bold">Movements</text>
    <text x="125" y="296">receipt/issue/xfer/adj</text>
    <text x="125" y="307">+ reservations</text>
    <text x="315" y="284" font-weight="bold">BOM</text>
    <text x="315" y="296">recursive explode +</text>
    <text x="315" y="307">cycle guard · where-used</text>
    <text x="510" y="284" font-weight="bold">Supersession</text>
    <text x="510" y="296">follow old→new</text>
    <text x="510" y="307">chain to current</text>
    <text x="678" y="284" font-weight="bold">Reorder/Forecast</text>
    <text x="678" y="296">ROP suggest · avg daily</text>
    <text x="678" y="307">→ ROP + stockout risk</text>
  </g>
  <line x1="390" y1="334" x2="390" y2="350" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>

  <!-- store -->
  <rect x="30" y="354" width="720" height="64" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="390" y="370" text-anchor="middle" font-size="9" font-weight="bold" fill="#334155">In-memory store (thread-safe) + stock-movement audit trail</text>
  <g font-size="6.6" fill="#475569" text-anchor="middle">
    <text x="390" y="387">parts · locations · stock · bom · supersessions · suppliers · movements · reservations · usage</text>
    <text x="390" y="402" fill="#64748b">PRT · LOC · SUP · MOV · RSV</text>
  </g>

  <text x="390" y="440" text-anchor="middle" font-size="8" fill="#0d9488" font-weight="bold">adk-mcp-sdk · rmcp 1.7 · stdio transport · registry-ready manifest</text>
  <text x="390" y="456" text-anchor="middle" font-size="7" fill="#94a3b8">Apache-2.0 · zavora-ai/mcp-parts</text>
</svg>
