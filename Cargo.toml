[package]
name = "mcp-parts"
version = "1.1.0"
edition = "2024"
rust-version = "1.94.1"
authors = ["James Karanja <james.karanja@zavora.ai>"]
description = "Parts MCP Server — a parts & spares platform (catalog, multi-location inventory with reorder points, bill-of-materials & where-used, supersession chains, suppliers, stock movements, reservations, reorder suggestions, and usage-based demand forecasting for predictive maintenance) with a full stock-movement audit trail"
license = "Apache-2.0"
repository = "https://github.com/zavora-ai/mcp-parts"
homepage = "https://enterprise.adk-rust.com"
keywords = ["mcp", "parts", "inventory", "spares", "maintenance"]
categories = ["development-tools"]
readme = "README.md"

[dependencies]
adk-mcp-sdk = { version = "0.2.0", git = "https://github.com/zavora-ai/adk-mcp-sdk.git", rev = "4dac4301441a8a51a042fd66cc1798f0ec3e3f55" }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[workspace]
